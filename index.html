<!DOCTYPE html>
<html lang="fr">
<head>
<title>Poker Planning</title>
<link rel="author" href="https://github.com/Passific/Poker-Planning"/>
<meta name="description" content="Poker-Planning">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css" type="text/css"/>
</head>
<body>
<div class="container">
    <div class="poker-planning"><img src="cards/basic/back.svg" alt="PP"></div>
    <div class="group">
        <input class="btn-group-input" id="name-input" value="" placeholder="What's your name?" required>
        <span class="btn-group"><button class="btn-group-btn" id="room-action" disabled>Enter room</button></span>
    </div>
    <div class="group">
        <input class="btn-group-input" id="room-input" value="" placeholder="Room code (optional)">
    </div>
    <p id="room-lock" hidden>Room: <strong id="room-lock-name"></strong> <a href="index.html">[change]</a></p>
    <p id="room-status" aria-live="polite">Enter your name to create a room automatically, or provide a room code to join.</p>
    <p id="room-help">Use a shared link, enter a room code to join, or leave it empty to create a new room.</p>
</div>
<script type="text/javascript" src="script.js"></script>
</body>
